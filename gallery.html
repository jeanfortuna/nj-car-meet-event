<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJ Car Meet Event | Gallery</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header"><div class="container site-header__inner"><a class="site-logo" href="index.html">NJ Car Meet Event</a><nav aria-label="Main navigation"><ul class="site-nav__list"><li><a class="site-nav__link" href="index.html">Home</a></li><li><a class="site-nav__link" href="about.html">About</a></li><li><a class="site-nav__link" href="schedule.html">Schedule</a></li><li><a class="site-nav__link" aria-current="page" href="gallery.html">Gallery</a></li><li><a class="site-nav__link" href="faq.html">FAQ</a></li><li><a class="site-nav__link" href="contact.html">Contact</a></li></ul></nav></div></header>
<main class="section">
  <div class="container">
    <div class="page-heading">
      <p class="page-heading__eyebrow">Event visuals</p>
      <h1>Gallery</h1>
      <p>These personal photographs are used to show the type of car-focused visual style planned for the event website.</p>
    </div>
    <div class="grid grid--cards">
      <figure class="media-block">
        <img src="assets/images/mustang-front-495.webp"
          srcset="assets/images/mustang-front-320.webp 320w, assets/images/mustang-front-495.webp 495w"
          sizes="(min-width: 64rem) 33vw, (min-width: 48rem) 50vw, 100vw"
          width="495" height="661"
          alt="Front three-quarter view of a yellow Mustang GT with the driver door open"
          loading="lazy" decoding="async">
        <figcaption>Front detail view of the Mustang.</figcaption>
      </figure>
      <figure class="media-block">
        <img src="assets/images/mustang-wide-883.webp"
          srcset="assets/images/mustang-wide-480.webp 480w, assets/images/mustang-wide-883.webp 883w"
          sizes="(min-width: 64rem) 33vw, (min-width: 48rem) 50vw, 100vw"
          width="883" height="660"
          alt="Yellow Mustang GT parked diagonally in an outdoor parking space"
          loading="lazy" decoding="async">
        <figcaption>Full exterior view of the Mustang.</figcaption>
      </figure>
      <figure class="media-block">
        <img src="assets/images/mustang-low-angle-520.webp"
          srcset="assets/images/mustang-low-angle-320.webp 320w, assets/images/mustang-low-angle-520.webp 520w"
          sizes="(min-width: 64rem) 33vw, (min-width: 48rem) 50vw, 100vw"
          width="520" height="667"
          alt="Low-angle front view of a yellow Mustang GT photographed through grass"
          loading="lazy" decoding="async">
        <figcaption>Low-angle exterior detail.</figcaption>
      </figure>
    </div>
  </div>
</main>
<footer class="site-footer"><div class="container"><p>NJ Car Meet Event capstone project.</p></div></footer>
</body>
</html>
